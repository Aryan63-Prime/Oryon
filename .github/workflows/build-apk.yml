name: Build Oryon AI Android APK (ARM64)

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust + ARM64 Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Check Rust host build
        run: |
          cd rust-core
          cargo check
          cargo test

      - name: Build liboryon_lm.so for arm64-v8a (Snapdragon 8 Elite)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
          RUSTFLAGS: "-C target-feature=+neon,+dotprod"
        run: |
          cd rust-core
          cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release

      - name: Set up Gradle & Assemble Debug APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: oryon-ai-iqoo13-apk
          path: app/build/outputs/apk/debug/app-debug.apk
