[package]
name = "oryon_lm"
version = "0.2.0"
edition = "2021"
description = "Rust LLM core (GGUF v3 + ORYN, ARM64 NEON, QNN Hexagon NPU probe, Android JNI) for iQOO 13"

[lib]
name = "oryon_lm"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
